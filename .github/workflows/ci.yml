name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Verify registry signatures of installed packages
        if: matrix.node == 22
        run: npm audit signatures
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package types resolve for ESM and CJS consumers
        if: matrix.node == 22
        run: npx --yes @arethetypeswrong/cli@0.18.5 --pack .

  codegen-reproducible:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch-schemas
      - run: npm run codegen
      - name: Generated code and API reference match the committed tree
        run: |
          git diff --exit-code -- src/generated docs/api-reference
          test -z "$(git status --porcelain -- src/generated docs/api-reference)"
