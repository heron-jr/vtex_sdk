name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Verify registry signatures of installed packages
        if: matrix.node == 22
        run: npm audit signatures
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Doc examples type-check
        if: matrix.node == 22
        run: npm run check-doc-examples
      - name: Package types resolve for ESM and CJS consumers
        if: matrix.node == 22
        run: npx --yes @arethetypeswrong/cli@0.18.5 --pack .

  codegen-reproducible:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch-schemas
      - run: npm run codegen
      - name: Generated code and API reference match the committed tree
        run: |
          git diff --exit-code -- src/generated docs/api-reference
          test -z "$(git status --porcelain -- src/generated docs/api-reference)"
